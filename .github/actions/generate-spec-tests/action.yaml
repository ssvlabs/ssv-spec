name: Generate Spec Tests
description: Set up Go environment and generate spec test JSON files into ../spec-tests

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
      with:
        go-version: 1.25.x

    - name: Get Dependencies
      shell: bash
      run: go get -v -t -d ./...

    - name: Generate JSONs
      shell: bash
      run: |
        go generate ./ssv/spectest/generate/...
        go generate ./qbft/spectest/generate/...
        go generate ./types/spectest/generate/...

    # The generators write straight to ../spec-tests/<module> (see
    # comparable.SpecTestsDirForModule), so there is nothing to copy here.
    - name: Verify spec-tests output
      shell: bash
      run: |
        set -euo pipefail
        OUTPUT_DIR="${GITHUB_WORKSPACE}/../spec-tests"

        if [ -z "$(ls -A "${OUTPUT_DIR}" 2>/dev/null)" ]; then
          echo "Generators produced no output in ${OUTPUT_DIR}" >&2
          exit 1
        fi
        echo "Generated spec-tests output in ${OUTPUT_DIR}"
