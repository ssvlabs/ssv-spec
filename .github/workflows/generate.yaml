name: Generated code

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "*" ]

jobs:

  ssz-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.25.x

      - name: Download dependencies
        run: go mod download

      - name: Regenerate SSZ encoders
        run: make generate-ssz

      - name: Fail if generated code is out of date
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated code is out of date — run 'make generate-ssz' and commit the result."
            exit 1
          fi
